target-version = "py311"
line-length = 120

[lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[format]
quote-style = "double"
indent-style = "space"

[lint.per-file-ignores]
# Script log AI do BTC cung cấp — giữ nguyên bản gốc
"scripts/log_*.py" = ["ALL"]
"scripts/submit_log.py" = ["ALL"]
