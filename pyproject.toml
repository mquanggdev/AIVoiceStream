[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-real-estate"
version = "3.0.0"
description = "Ocean Park Voice Agent - trợ lý tư vấn căn hộ bằng giọng nói"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "openai>=1.60.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "aiosqlite>=0.20.0",
    "email-validator>=2.2.0",
    "PyJWT>=2.10.0",
    "pwdlib[argon2]>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
markers = [
    "live_ai: calls the real OpenRouter API (needs OPENROUTER_API_KEY); skipped by default",
]
